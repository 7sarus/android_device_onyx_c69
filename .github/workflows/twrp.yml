name: Build TWRP Recovery for Onyx Boox C69

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Compile TWRP 11.0
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Maximize Build Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize & Sync Minimal TWRP-11 Manifest
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          mkdir -p twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Integrate Device Tree & Patch Build Rules
        run: |
          mkdir -p twrp/device/onyx/c69
          cp -r device_tree/* twrp/device/onyx/c69/
          rm -rf twrp/device/onyx/c69/device_tree twrp/device/onyx/c69/.git
          # Fix rsync root/vendor directory collision during ramdisk creation (TWRP issue #78)
          grep -rl "rsync -a" twrp/build* twrp/vendor* 2>/dev/null | xargs sed -i 's/rsync -a /rsync -a --force /g' || true
          # Patch minuitwrp graphics DRM backend for Onyx Boox EPDC & CRTC 112 continuous splash
          if [ -f twrp/device/onyx/c69/patches/graphics_drm.cpp ]; then
            cp -f twrp/device/onyx/c69/patches/graphics_drm.cpp twrp/bootable/recovery/minuitwrp/graphics_drm.cpp
            echo "Successfully patched twrp/bootable/recovery/minuitwrp/graphics_drm.cpp"
          fi

      - name: Compile TWRP Recovery Image
        run: |
          cd twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_c69-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-c69-recovery
          path: twrp/out/target/product/c69/recovery.img
          if-no-files-found: error
